name: Build and Test

# Unlike chimera, libevpl does not use a merge queue, so the matrix runs on the
# pull request itself and again on push to main.  It can afford to: the whole
# suite is a couple of hundred fast tests rather than a multi-hour NAS
# integration run, so there is no reason to defer it to a queue.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to exercise during development
        type: choice
        options: [all, windows]
        default: all

# One phase, not two.  Each cell builds the container image it needs and loads
# it into that runner's docker daemon, then compiles and tests inside it:
#
#   Test      build image + compile + ctest    (test)
#   Analyze   build image + scan-build         (static-analysis)
#   macOS     compile + ctest, hosted runner   (macos)
#
# There used to be a separate phase that built each image once and pushed it to
# a registry for the test cells to pull.  That shape does not survive the move
# to GitHub-hosted runners: this workflow runs on `pull_request`, and a pull
# request from a fork gets a read-only GITHUB_TOKEN that cannot write a package
# -- which is how contributions actually arrive here.  What crosses the network
# now is only the buildx layer cache, read by every run and written back only by
# a push to main.  With an unchanged Dockerfile a "build" is therefore a layer
# restore, which is what the registry round trip cost anyway.
#
# That cache lives in the GitHub Actions cache (type=gha) rather than a
# registry, because with nothing pushed there is no registry left to justify.
# The Actions cache also scopes by branch, which does for free what a registry
# needs an explicit ref guard for -- a pull request reads the default branch's
# scope and writes only its own, so it cannot poison main -- and its read works
# from a fork's read-only token without depending on how package permissions
# resolve there.  This workflow now touches GHCR for exactly one thing: pulling
# the mirrored darwin ccache binary on the macOS job.
#
# Cancel superseded runs on a branch: a PR that is pushed to twice does not
# need the first matrix to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Compiler cache ceiling.  A repository gets 10 GB of Actions cache at no
  # cost, evicting least-recently-used entries to stay inside it, and only a
  # paid plan can raise that as billed storage.  This matrix saves 16 entries
  # per push to main, so the ceiling below is what keeps them comfortably
  # inside the free budget.
  CCACHE_MAXSIZE: 1G
  # Software provider: CI needs no RDMA hardware. The RDM-only regression
  # overrides this with tcp;ofi_rxm for its child process.
  FI_PROVIDER: tcp

jobs:
  # ---------------------------------------------------------------------------
  # Compile and run the suite, one job per image/arch/build type.
  #
  # --privileged because the tests put each network-listening case in its own
  # network namespace; REQUIRE_NETNS_TESTS=ON makes configure fail rather than
  # quietly fall back to the shared-port path if that isolation is unavailable,
  # which would otherwise turn a broken runner into a green run.
  # ---------------------------------------------------------------------------
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    name: Test ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Require libfabric wherever the distro provides >= 1.17. Ubuntu
          # 22.04 has 1.11 and retains coverage with the backend disabled.
          # Devcontainer uses Clang; distro images use their default GCC.
          # docs/, not .devcontainer/, for the devcontainer context: the
          # Dockerfile ADDs the Gemfile that the docs build needs, and that
          # lives under docs/.  devcontainer.json says the same thing with
          # "context": "../docs".
          - { image_name: devcontainer, context: docs, dockerfile: .devcontainer/Dockerfile, cache: libevpl-dev, arch: amd64, runner: ubuntu-24.04, build_type: Release, cmake_extra: "-DLIBFABRIC_ENABLED=ON -DCMAKE_C_COMPILER=clang" }
          - { image_name: devcontainer, context: docs, dockerfile: .devcontainer/Dockerfile, cache: libevpl-dev, arch: amd64, runner: ubuntu-24.04, build_type: Debug, cmake_extra: "-DLIBFABRIC_ENABLED=ON -DCMAKE_C_COMPILER=clang" }
          - { image_name: ubuntu26, context: ".", dockerfile: Dockerfile.ubuntu26.04, cache: libevpl-ubuntu26, arch: amd64, runner: ubuntu-24.04, build_type: Release, cmake_extra: "-DLIBFABRIC_ENABLED=ON" }
          - { image_name: ubuntu26, context: ".", dockerfile: Dockerfile.ubuntu26.04, cache: libevpl-ubuntu26, arch: amd64, runner: ubuntu-24.04, build_type: Debug, cmake_extra: "-DLIBFABRIC_ENABLED=ON" }
          - { image_name: ubuntu24, context: ".", dockerfile: Dockerfile.ubuntu24.04, cache: libevpl-ubuntu24, arch: amd64, runner: ubuntu-24.04, build_type: Release, cmake_extra: "-DLIBFABRIC_ENABLED=ON" }
          - { image_name: ubuntu24, context: ".", dockerfile: Dockerfile.ubuntu24.04, cache: libevpl-ubuntu24, arch: amd64, runner: ubuntu-24.04, build_type: Debug, cmake_extra: "-DLIBFABRIC_ENABLED=ON" }
          - { image_name: ubuntu22, context: ".", dockerfile: Dockerfile.ubuntu22.04, cache: libevpl-ubuntu22, arch: amd64, runner: ubuntu-24.04, build_type: Release, cmake_extra: "-DIO_URING_ENABLED=OFF -DLIBFABRIC_ENABLED=OFF" }
          - { image_name: ubuntu22, context: ".", dockerfile: Dockerfile.ubuntu22.04, cache: libevpl-ubuntu22, arch: amd64, runner: ubuntu-24.04, build_type: Debug, cmake_extra: "-DIO_URING_ENABLED=OFF -DLIBFABRIC_ENABLED=OFF" }
          - { image_name: rocky9, context: ".", dockerfile: Dockerfile.rocky9, cache: libevpl-rocky9, arch: amd64, runner: ubuntu-24.04, build_type: Release, cmake_extra: "-DLIBFABRIC_ENABLED=ON" }
          - { image_name: rocky9, context: ".", dockerfile: Dockerfile.rocky9, cache: libevpl-rocky9, arch: amd64, runner: ubuntu-24.04, build_type: Debug, cmake_extra: "-DLIBFABRIC_ENABLED=ON" }
          - { image_name: rocky10, context: ".", dockerfile: Dockerfile.rocky10, cache: libevpl-rocky10, arch: amd64, runner: ubuntu-24.04, build_type: Release, cmake_extra: "-DLIBFABRIC_ENABLED=ON" }
          - { image_name: rocky10, context: ".", dockerfile: Dockerfile.rocky10, cache: libevpl-rocky10, arch: amd64, runner: ubuntu-24.04, build_type: Debug, cmake_extra: "-DLIBFABRIC_ENABLED=ON" }
          # The devcontainer is the one image tested on both architectures.
          - { image_name: devcontainer, context: docs, dockerfile: .devcontainer/Dockerfile, cache: libevpl-dev, arch: arm64, runner: ubuntu-24.04-arm, build_type: Release, cmake_extra: "-DLIBFABRIC_ENABLED=ON -DCMAKE_C_COMPILER=clang" }
          - { image_name: devcontainer, context: docs, dockerfile: .devcontainer/Dockerfile, cache: libevpl-dev, arch: arm64, runner: ubuntu-24.04-arm, build_type: Debug, cmake_extra: "-DLIBFABRIC_ENABLED=ON -DCMAKE_C_COMPILER=clang" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One scope per image AND arch.  buildx defaults to a single scope for the
      # whole workflow, so six images building concurrently would overwrite each
      # other's cache and sit silently at a 0% hit rate -- a failure that costs
      # the full build time while looking exactly like a cold start.
      #
      # mode=min, not max: these Dockerfiles are essentially one package-install
      # layer rather than a chain of intermediate stages, so min caches
      # substantially the same thing at a fraction of the size.  That matters
      # here, because these scopes share a per-repository cache quota with the
      # 16 ccache entries below.
      #
      # cache-to only from a push to main, so a pull request reads the shared
      # cache but never writes it.  Branch scoping would enforce that anyway;
      # the guard also stops a PR consuming quota for a scope nothing can read.
      #
      # And only from the Release cell.  Release and Debug differ solely in the
      # cmake invocation INSIDE the container -- the image is byte-identical --
      # so letting both export means two uploads of the same layers racing for
      # last-writer on every scope.  Which of the two writes is arbitrary; that
      # exactly one does is not.
      - name: Build the ${{ matrix.image_name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ matrix.image_name }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.cache }}-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && matrix.build_type == 'Release' && format('type=gha,scope={0}-{1},mode=min', matrix.cache, matrix.arch) || '' }}
          build-args: |
            UBUNTU_MIRROR=azure

      # A local ccache directory, mounted into the container, in place of the
      # HTTP remote backend that used to point at self-hosted infrastructure.
      # Actions caches are branch-scoped: a run reads its own ref's scope and
      # the default branch's, and this workflow runs on push to main, so what a
      # main build saves is what every pull request restores.  A miss is a cold
      # build, never a failed job.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-

      - name: Configure, build and test inside the container
        run: |
          mkdir -p "${{ github.workspace }}/ctest-results" "${{ runner.temp }}/ccache"
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE \
            -e FI_PROVIDER \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v /build \
            -w /build \
            ${{ matrix.image_name }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              # CMAKE_C_COMPILER_LAUNCHER explicitly: libevpl, unlike chimera,
              # has no find_program(ccache) in its CMakeLists, and the compiler
              # symlinks the distro ccache package installs are not on PATH in a
              # non-login shell.  Without this the cache is inert -- which is
              # what the previous CCACHE_REMOTE_STORAGE setup was, and why its
              # hit rate was never worth reading.
              #
              # Guarded rather than assumed.  Every image is expected to carry
              # ccache now, but an image that does not must build uncached
              # rather than fail: an unconditional `ccache -z` is how this broke
              # the four devcontainer cells while every distro cell passed.
              if command -v ccache > /dev/null; then
                # ccache keeps its counters inside the cache directory, so a
                # restored one carries the statistics of the run that made it.
                # Zero them so --show-stats describes this run alone.
                ccache -z > /dev/null
                launcher=-DCMAKE_C_COMPILER_LAUNCHER=ccache
              else
                echo "::warning::ccache not found in this image; building uncached"
                launcher=
              fi
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                    ${launcher} \
                    -DREQUIRE_NETNS_TESTS=ON ${{ matrix.cmake_extra }} /workspace
              # Require the optional SQLite targets so missing dependencies
              # cannot silently remove their tests from CI.
              ninja all otel_sqlite_test otel-trace
              ccache --show-stats || true
              ccache --trim-max-size ${CCACHE_MAXSIZE} || true
              rc=0
              ctest --output-on-failure --test-output-size-failed 65536 \
                    --timeout 300 -j "$(nproc)" \
                    --output-junit /workspace/ctest-results/results.xml || rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "ctest reported failures; rerunning them to tell a flake from a real failure"
                if ctest --rerun-failed --output-on-failure \
                         --test-output-size-failed 65536 --timeout 300; then
                  echo "rerun passed: treating as flaky"
                  cp /build/Testing/Temporary/LastTestsFailed.log /workspace/flaky-rescued.log
                  rc=0
                else
                  echo "rerun still failing: real failure"
                fi
              fi
              exit $rc'

      # The container runs as root, so the cache it wrote is root-owned and the
      # runner user cannot tar it up.
      - name: Take ownership of the ccache directory
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/ccache"

      # Only from main, and even when the suite failed: the cache reflects a
      # build that happened, and withholding it would make every later run pay
      # for a test failure that has nothing to do with compilation.  A pull
      # request's own ref scope is unreadable by anything else, so saving there
      # would only consume the repository's cache budget.
      - name: Save the ccache directory
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30

      # A rescued flake is not a failure, but it should not vanish either --
      # the artifact is what makes it reviewable after the fact.
      - name: Upload flaky-test marker
        if: ${{ hashFiles('flaky-rescued.log') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: flaky-marker-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: flaky-rescued.log
          retention-days: 14

  # ---------------------------------------------------------------------------
  # clang static analysis.
  #
  # libevpl had none of this until chimera's analysis of its own tree -- which
  # includes ext/libevpl -- started failing on a libevpl test file.  Running it
  # here catches that at source instead of in a downstream bump.
  # ---------------------------------------------------------------------------
  static-analysis:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    name: Analyze ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, build_type: Release, image_name: devcontainer }
          - { arch: amd64, runner: ubuntu-24.04, build_type: Debug,   image_name: devcontainer }
          - { arch: arm64, runner: ubuntu-24.04-arm, build_type: Release, image_name: devcontainer }
          - { arch: arm64, runner: ubuntu-24.04-arm, build_type: Debug,   image_name: devcontainer }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # cache-from only, and the same scope the devcontainer test cells write:
      # they already populate it from main, and an analysis build has nothing to
      # add that they have not.
      - name: Build the devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: docs
          file: .devcontainer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: devcontainer:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=libevpl-dev-${{ matrix.arch }}
          build-args: |
            UBUNTU_MIRROR=azure

      # IO_URING_NVME_ENABLED=OFF matches chimera, and is what that option's
      # own help text recommends: the NVMe uring_cmd path sends the analyzer
      # into liburing's inline functions, where it reports a null dereference
      # in the system header -- not actionable, and not ours.
      - name: Perform clang static analysis
        id: static-analysis
        run: |
          set -o pipefail
          mkdir -p "${{ github.workspace }}/scan-report"
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/scan-report:/scan-report" \
            -v /build \
            -w /build \
            devcontainer:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '\
              scan-build --status-bugs -o /scan-report \
              sh -c "cmake -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} -D IO_URING_NVME_ENABLED=OFF -D LIBFABRIC_ENABLED=ON -B /build -S /workspace -G Ninja && ninja -C /build"' \
            2>&1 | tee "${{ github.workspace }}/scan-report/scan-build-output.txt"

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: scan-report-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS, on a GitHub-hosted runner.
  #
  # libevpl builds on Darwin with kqueue where Linux uses epoll, and the CMake
  # already knows where Homebrew keeps keg-only openssl and the uthash headers.
  # Nothing here is containerised, and none of the Linux-only backends (io_uring,
  # rdmacm, xlio) exist, so this covers the kqueue core and the portable paths
  # above it -- which is exactly the part nothing else in this matrix exercises.
  # ---------------------------------------------------------------------------
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    name: Test macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          # The same pinned upstream ccache the Linux images install, from the
          # public package chimera's mirror-ccache workflow republishes -- so
          # every platform in this matrix runs one known build rather than
          # whatever its packager happened to ship.  Upstream's darwin asset is
          # a single universal binary, covering Intel and Apple Silicon alike.
          CCACHE_REF: ghcr.io/chimera-nas/ccache:4.14-darwin
          # The same version the Linux images pin (QUINT_VERSION in every
          # Dockerfile).  Pinned rather than floating because the case tables
          # the conformance suites run are GENERATED from the models at build
          # time with fixed seeds: a different quint samples the models
          # differently, so an unpinned macOS would be compiling a different
          # corpus from the rest of the matrix -- testing something else
          # rather than testing more widely.
          QUINT_VERSION: 0.32.0
        run: |
          brew update
          # openssl@3 and nghttp2 are keg-only; CMakeLists.txt already adds the
          # Homebrew prefixes for them.  uthash is headers only.
          brew install cmake ninja bison openssl@3 nghttp2 uthash protobuf-c sqlite oras libfabric
          oras pull "${CCACHE_REF}" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1
          # quint is not a brew formula; upstream publishes it on npm, which is
          # also what pins it exactly.  The Linux images take it from the GHCR
          # mirror instead, but that image carries a Linux node+quint tree and
          # cannot be reused here.
          npm install -g "@informalsystems/quint@${QUINT_VERSION}"
          quint --version

      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.build_type }}-

      - name: Configure and build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DLIBFABRIC_ENABLED=ON \
                -DBISON_EXECUTABLE="$(brew --prefix bison)/bin/bison" \
                -S "${{ github.workspace }}" -B "${{ runner.temp }}/build"
          # Require SQLite coverage here as well as in the Linux images.
          ninja -C "${{ runner.temp }}/build" all otel_sqlite_test otel-trace
          ccache --show-stats || true
          ccache --trim-max-size "${CCACHE_MAXSIZE}" || true

      - name: Save the ccache directory
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ matrix.build_type }}-${{ github.sha }}

      # No REQUIRE_NETNS_TESTS here: network namespaces are a Linux feature, so
      # the suite falls back to its serialised shared-port path on Darwin.
      - name: Test
        run: |
          cd "${{ runner.temp }}/build"
          mkdir -p "${{ github.workspace }}/ctest-results"
          rc=0
          ctest --output-on-failure --test-output-size-failed 65536 \
                --timeout 300 -j "$(sysctl -n hw.ncpu)" \
                --output-junit "${{ github.workspace }}/ctest-results/results.xml" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "ctest reported failures; rerunning them to tell a flake from a real failure"
            if ctest --rerun-failed --output-on-failure --timeout 300; then
              echo "rerun passed: treating as flaky"
              rc=0
            else
              echo "rerun still failing: real failure"
            fi
          fi
          exit $rc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-macos-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # One job to require in branch protection, so the set of matrix legs can
  # change without editing the protection rule.  It fails if any dependency
  # failed or was cancelled -- `needs.*.result` rather than success(), so a
  # skipped-but-not-run leg cannot pass for the wrong reason.
  # ---------------------------------------------------------------------------
  ci-complete:
    name: CI complete
    if: always()
    needs: [test, static-analysis, macos, native]
    runs-on: ubuntu-24.04
    # It reads `needs` and nothing else -- no checkout, no API call -- so the
    # token it runs with can be empty.
    permissions: {}
    steps:
      - name: Check matrix results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: ${results}"
          for r in ${results}; do
            if [ "$r" = "skipped" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.platform }}" = "windows" ]; then
              continue
            fi
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done

  conformance-corpus:
    name: Generate native conformance cases
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned model generator
        run: npm install -g @informalsystems/quint@0.32.0
      # The generators pin Quint's TypeScript backend, matching Linux/macOS.
      - name: Generate case tables from this commit
        run: python3 scripts/generate_conformance_corpus.py corpus
      - uses: actions/upload-artifact@v6
        with:
          name: native-conformance-corpus
          path: corpus/*.h
          if-no-files-found: error
          retention-days: 7

  native:
    needs: conformance-corpus
    name: MSVC ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, arch: x64, config: Debug}
          - {runner: windows-2022, arch: x64, config: Release}
          - {runner: windows-11-arm, arch: ARM64, config: Debug}
          - {runner: windows-11-arm, arch: ARM64, config: Release}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: a1cae005c39be7b18ba319fced856b68d7276271
          path: _vcpkg
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.arch }}-
      - uses: actions/download-artifact@v6
        with:
          name: native-conformance-corpus
          path: corpus
      - name: Install parser generators
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/winflexbison.zip"
          Invoke-WebRequest https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') { throw 'WinFlexBison checksum mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/winflexbison"
      - name: Configure native Windows with dependencies
        shell: pwsh
        run: |
          & ./_vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triplet = '${{ matrix.arch }}'.ToLower() + '-windows'
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} "-DCMAKE_TOOLCHAIN_FILE=$pwd/_vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=$triplet" "-DVCPKG_HOST_TRIPLET=$triplet" "-DFLEX_EXECUTABLE=$env:RUNNER_TEMP/winflexbison/win_flex.exe" "-DBISON_EXECUTABLE=$env:RUNNER_TEMP/winflexbison/win_bison.exe" -DOTEL_SQLITE=ON "-DEVPL_CONFORMANCE_CASES_DIR=$pwd/corpus"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4
      - name: Test native backends
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --timeout 300 --output-junit results.xml
      - name: Install and consume native DLLs
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP/evpl-install"
          cmake --install build --config ${{ matrix.config }} --prefix $prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/installed -B consumer -G "Visual Studio 17 2022" -A ${{ matrix.arch }} "-DCMAKE_PREFIX_PATH=$prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build consumer --config ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triplet = '${{ matrix.arch }}'.ToLower() + '-windows'
          $dependencies = "$pwd/build/vcpkg_installed/$triplet"
          if ('${{ matrix.config }}' -eq 'Debug') { $dependencies += '/debug' }
          $env:PATH = "$prefix/bin;$dependencies/bin;$env:PATH"
          & ./consumer/${{ matrix.config }}/consumer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.config }}
          path: |
            build/results.xml
            build/Testing/Temporary/
          if-no-files-found: ignore
