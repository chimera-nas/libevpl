name: Libfabric
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Libfabric ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    env:
      FI_PROVIDER: tcp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison pkg-config \
            uthash-dev libssl-dev libnuma-dev libcurl4-openssl-dev \
            libfabric-dev libfabric-bin
      - name: Configure with libfabric required
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLIBFABRIC_ENABLED=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test libfabric, core, and sockets with epoll and select
        run: ctest --test-dir build -R '/(libfabric|core|socket)/' --output-on-failure --timeout 60

  macos:
    name: Libfabric macOS ${{ matrix.build_type }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    env:
      FI_PROVIDER: tcp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake ninja bison openssl@3 uthash libfabric
      - name: Configure with native libfabric required
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBISON_EXECUTABLE="$(brew --prefix bison)/bin/bison"
          -DLIBFABRIC_ENABLED=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test libfabric, core, and sockets with kqueue and select
        run: ctest --test-dir build -R '/(libfabric|core|socket)/' --output-on-failure --timeout 60
