# The self-hosted runner labels this project's CI targets.  Declaring them
# keeps actionlint's output to real findings: without this every matrix leg
# reports an "unknown label", and a genuine error is easy to miss among them.
#
# actionlint is worth running before pushing a workflow change -- GitHub
# rejects a file whose expression syntax is wrong without reporting anything at
# all, so the symptom is a workflow that silently never runs.
self-hosted-runner:
  labels:
    - arc-amd64
    - arc-arm64
    - arc-small
